name: Install Supabase sync directly
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject sync script into index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./supabase-sync-fix.js?v=57"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s: raise SystemExit('body marker not found')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Load Supabase sync directly from index' && git push)
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/force-sync-loader.yml || true
          git commit -m 'Remove one-time sync loader workflow' || true
          git push || true
