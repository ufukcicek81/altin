name: Patch Supabase Sync Bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Supabase bridge directly into index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="/supabase-live-bridge.js?v=59"></script>\n'
          if 'supabase-live-bridge.js?v=59' not in text:
              marker = '</head>'
              if marker not in text:
                  raise SystemExit('index.html: </head> bulunamadı')
              text = text.replace(marker, tag + marker, 1)
              p.write_text(text, encoding='utf-8')
              print('Supabase bridge injected.')
          else:
              print('Supabase bridge already present.')
          PY

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/patch-sync.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-sync.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: load Supabase sync bridge before app"
            git push
          fi
