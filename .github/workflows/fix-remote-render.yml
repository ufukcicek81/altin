name: Fix remote settings render

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch applyRemoteSettings
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='function applyRemoteSettings(data, force) {'
          start=s.find(marker)
          if start<0: raise SystemExit('applyRemoteSettings not found')
          brace=s.find('{',start)
          depth=0
          end=None
          for i in range(brace,len(s)):
              if s[i]=='{': depth+=1
              elif s[i]=='}':
                  depth-=1
                  if depth==0:
                      end=i+1; break
          if end is None: raise SystemExit('function end not found')
          fn=s[start:end]
          if 'window.__asilRemoteRenderV2' not in fn:
              needle='      settings = data;'
              if needle not in fn: raise SystemExit('settings assignment not found')
              inject='''      settings = data;\n      // Remote settings must update the already-open price screen immediately.\n      try {\n        if (typeof renderTable === 'function') renderTable();\n        if (typeof applyShopLogo === 'function') applyShopLogo();\n        if (typeof applyTheme === 'function') applyTheme();\n        if (typeof updateDovizBant === 'function') updateDovizBant({});\n        window.__asilRemoteRenderV2 = true;\n      } catch (e) { console.error('[Asil remote render]', e); }'''
              fn=fn.replace(needle,inject,1)
          # Expose the function so the Supabase polling layer can call the real function.
          if 'window.applyRemoteSettings = applyRemoteSettings;' not in s[end:]:
              s=s[:end]+"\ntry { window.applyRemoteSettings = applyRemoteSettings; } catch(e) {}\n"+s[end:]
              end += len("\ntry { window.applyRemoteSettings = applyRemoteSettings; } catch(e) {}\n")
          s=s[:start]+fn+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix live remote settings rendering"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/fix-remote-render.yml || true
          git commit -m "Remove one-time remote render workflow" || true
          git push || true
