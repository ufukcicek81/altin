<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Asil Kuyumculuk TV</title>
<style>
:root{--bg:#fff;--card:#fff;--soft:#f4f7f9;--line:#d7e0e7;--text:#172235;--muted:#687989;--red:#d92c2c;--green:#16824f;--blue:#2f77b7;--goldRows:10}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}body.dark{--bg:#0d141b;--card:#111a22;--soft:#18232d;--line:#2b3b48;--text:#edf5fb;--muted:#9fb0be;--red:#ff6b67;--green:#55d486;--blue:#69b8ff}
.app{width:100vw;height:100vh;height:100dvh;overflow:hidden;display:grid;grid-template-rows:64px 74px minmax(0,1fr);gap:6px;padding:6px 10px 8px}.top{position:relative;display:flex;align-items:center;justify-content:center}.logo{height:60px;max-width:290px;object-fit:contain}.theme{position:absolute;right:8px;top:10px;width:82px;height:40px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--text);font-size:18px;cursor:pointer}.status{display:grid;grid-template-columns:1.25fr .72fr .72fr;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}.status>div{min-width:0;padding:7px 16px;display:flex;flex-direction:column;justify-content:center}.status>div+div{border-left:1px solid var(--line)}.live{font-size:21px;font-weight:900;white-space:nowrap}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#15c875;margin-right:6px}.sub,.lab{font-size:12px;color:var(--muted)}.val{font-size:31px;line-height:1;font-weight:950}#hasA{color:var(--red)}#hasS{color:var(--green)}
.dashboard{min-height:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,68fr) minmax(335px,32fr);gap:10px}.dashboard.only-gold{grid-template-columns:1fr}.dashboard.only-gold #sidePanel{display:none!important}.card{min-width:0;min-height:0;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px}.gold{display:grid;grid-template-rows:44px 34px minmax(0,1fr)}.title{display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);font-size:22px;font-weight:950}.head,.row{display:grid;grid-template-columns:1.45fr 1fr 1fr 1fr;align-items:center}.head{padding:0 16px;background:var(--soft);border-bottom:1px solid var(--line);font-size:13px;font-weight:900;color:var(--muted)}.head span:not(:first-child),.num{text-align:right}.head span:nth-child(2){color:var(--red)}.head span:nth-child(3){color:var(--green)}.head span:nth-child(4){color:var(--blue)}.rows{min-height:0;overflow:hidden;display:grid;grid-template-rows:repeat(var(--goldRows),minmax(0,1fr))}.row{min-height:0;overflow:hidden;padding:2px 16px;border-bottom:1px solid var(--line)}.row:nth-child(even){background:rgba(110,135,155,.045)}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(17px,1.35vw,24px);font-weight:900;line-height:1.05}.num{font-size:clamp(21px,1.8vw,31px);font-weight:950;line-height:1}.buy{color:var(--red)}.sell{color:var(--green)}.cc{color:var(--blue)}.chg{display:block;margin-top:2px;font-size:clamp(9px,.75vw,13px);line-height:1;font-weight:800;opacity:.9}.side{min-height:0;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:10px}.side.one{grid-template-rows:minmax(0,1fr)}.sidecard{min-height:0;overflow:hidden;display:grid;grid-template-rows:44px 32px minmax(0,1fr)}.side-title{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font-size:20px;font-weight:950}.fx .side-title{color:var(--blue)}.side-head,.side-row{display:grid;grid-template-columns:1.25fr .75fr .75fr;align-items:center}.side-head{padding:0 14px;background:var(--soft);border-bottom:1px solid var(--line);font-size:12px;font-weight:900;color:var(--muted)}.side-head span:nth-child(2){color:var(--red)}.side-head span:nth-child(3){color:var(--green)}.side-head span:not(:first-child),.side-row span:not(:first-child){text-align:right}.side-rows{min-height:0;overflow:hidden;display:grid;grid-auto-rows:minmax(0,1fr)}.side-row{min-height:0;overflow:hidden;padding:2px 14px;border-bottom:1px solid var(--line)}.side-row:nth-child(even){background:rgba(110,135,155,.04)}.side-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(15px,1.2vw,21px);font-weight:900;line-height:1}.side-num{font-size:clamp(18px,1.45vw,25px);font-weight:950;line-height:1}@keyframes flashUp{0%{background:rgba(22,130,79,.24)}100%{background:transparent}}@keyframes flashDown{0%{background:rgba(217,44,44,.22)}100%{background:transparent}}.flash-up{animation:flashUp .55s ease-out}.flash-down{animation:flashDown .55s ease-out}
@media(max-height:820px){.app{grid-template-rows:52px 62px minmax(0,1fr);gap:4px;padding:4px 7px 5px}.logo{height:48px}.theme{top:6px;height:34px}.status>div{padding:4px 11px}.live{font-size:17px}.sub,.lab{font-size:10px}.val{font-size:25px}.gold{grid-template-rows:36px 28px minmax(0,1fr)}.title{font-size:18px;padding:0 14px}.head{font-size:11px;padding:0 12px}.row{padding:1px 12px}.name{font-size:clamp(14px,1.15vw,19px)}.num{font-size:clamp(17px,1.45vw,24px)}.chg{font-size:clamp(7px,.6vw,10px)}.sidecard{grid-template-rows:36px 26px minmax(0,1fr)}.side-title{font-size:16px;padding:0 12px}.side-head{font-size:10px;padding:0 11px}.side-row{padding:1px 11px}.side-name{font-size:clamp(12px,1vw,16px)}.side-num{font-size:clamp(14px,1.15vw,19px)}}
</style>
</head>
<body>
<div class="app">
<div class="top"><img id="logo" class="logo" src="asil-logo-integrated.png" alt="Asil Kuyumculuk"><button id="theme" class="theme">☀️ 🌙</button></div>
<div class="status"><div><div class="live"><span class="dot"></span>Piyasa Canlı</div><div class="sub">Son güncelleme&nbsp; <span id="time">—</span></div></div><div><div class="lab">Has Alış</div><div id="hasA" class="val">—</div></div><div><div class="lab">Has Satış</div><div id="hasS" class="val">—</div></div></div>
<div id="dashboard" class="dashboard"><div class="card gold"><div class="title">🪙 Altın Fiyatları</div><div class="head"><span>Birim</span><span>Alış</span><span>Satış</span><span>K. Kartı</span></div><div id="goldRows" class="rows"></div></div><div id="sidePanel" class="side"><div id="fxCard" class="card sidecard fx"><div class="side-title">💱 DÖVİZ KURLARI</div><div class="side-head"><span>Döviz</span><span>Alış</span><span>Satış</span></div><div id="fxRows" class="side-rows"></div></div><div id="scrapCard" class="card sidecard"><div class="side-title">🪙 HURDA ALTIN</div><div class="side-head"><span>Tür</span><span>Alış</span><span>Satış</span></div><div id="scrapRows" class="side-rows"></div></div></div></div>
</div>
<script>
(function(){'use strict';
var SUPABASE_URL='https://isrcaoulynycmwnxofgn.supabase.co';
var SUPABASE_KEY='sb_publishable_2lHpVrZEgHmPjWD8kOEuLA_Fz6gzZEe';
var TABLE=SUPABASE_URL+'/rest/v1/app_settings';
var WORKER='https://altin-proxy.ufuk87900.workers.dev';
var settings={labor:{},customItems:[],itemOrder:[],hiddenItems:[],deletedItems:[],kkOran:0,dovizDuz:{},hurdaCarp:{},theme:'light',hasDuzA:0,hasDuzS:0};
var tvDisplay={showDoviz:true,showHurda:true};
var live={},hasA=0,hasS=0,prevPrice={},settingsBusy=false,displayBusy=false,priceBusy=false,builtSignature='';
var ITEMS=[{id:'has24',label:'24 Ayar',defA:1,defS:1.003},{id:'ayar22',label:'22 Ayar',defA:.91,defS:.922},{id:'tam',label:'Tam',defA:.993,defS:1.008},{id:'yarim',label:'Yarım',defA:.993,defS:1.009},{id:'ceyrek',label:'Çeyrek',defA:.992,defS:1.01},{id:'besli',label:'Beşli',defA:.993,defS:1.008},{id:'yarimbes',label:'Yarım Beşli',defA:.993,defS:1.0085},{id:'resat',label:'Reşat',defA:.993,defS:1.007},{id:'ata',label:'Ata',defA:.993,defS:1.007},{id:'gremise',label:'Gremise',defA:.993,defS:1.008}];
var DEFAULT_FX=[['usd','🇺🇸','USD'],['eur','🇪🇺','EUR'],['gbp','🇬🇧','GBP'],['sar','🇸🇦','SAR'],['chf','🇨🇭','CHF']];
var DEFAULT_SCR=[['hurda22','22 Ayar Hurda',22/24],['hurda14','14 Ayar Hurda',14/24],['hurda8','8 Ayar Hurda',8/24]];
function byId(id){return document.getElementById(id)}
function fmt(n){return new Intl.NumberFormat('tr-TR').format(Math.round(Number(n)||0))}
function fxItems(){var a=settings.dovizItems;return Array.isArray(a)&&a.length?a.map(function(x){return{id:x.id,flag:x.flag||'',label:x.label||String(x.id).toUpperCase()}}):DEFAULT_FX.map(function(x){return{id:x[0],flag:x[1],label:x[2]}})}
function scrapItems(){var a=settings.hurdaItems;return Array.isArray(a)&&a.length?a.map(function(x){return{id:x.id,label:x.label,oran:Number(x.oran)||0}}):DEFAULT_SCR.map(function(x){return{id:x[0],label:x[1],oran:x[2]}})}
function allItems(){var a=ITEMS.concat(Array.isArray(settings.customItems)?settings.customItems:[]),map={},out=[];a.forEach(function(x){map[x.id]=x});(Array.isArray(settings.itemOrder)?settings.itemOrder:[]).forEach(function(id){if(map[id]){out.push(map[id]);delete map[id]}});a.forEach(function(x){if(map[x.id])out.push(x)});var hidden=settings.hiddenItems||[],deleted=settings.deletedItems||[];return out.filter(function(x){return hidden.indexOf(x.id)<0&&deleted.indexOf(x.id)<0})}
function labor(i){return settings.labor&&settings.labor[i.id]?settings.labor[i.id]:{a:i.defA||1,s:i.defS||1}}
function applyTheme(){var mode=localStorage.getItem('asil_theme_local')||settings.theme||'light';document.body.classList.toggle('dark',mode==='dark')}
byId('theme').addEventListener('click',function(){var n=document.body.classList.contains('dark')?'light':'dark';localStorage.setItem('asil_theme_local',n);applyTheme()});
function structureSignature(){return JSON.stringify({items:allItems().map(function(x){return x.id+':'+x.label}),fx:fxItems().map(function(x){return x.id+':'+x.label}),sc:scrapItems().map(function(x){return x.id+':'+x.label+':'+x.oran}),d:tvDisplay.showDoviz,h:tvDisplay.showHurda})}
function build(){var sig=structureSignature();if(sig===builtSignature)return;builtSignature=sig;var list=allItems();document.documentElement.style.setProperty('--goldRows',String(Math.max(1,list.length)));var g='';list.forEach(function(i){g+='<div class="row"><span class="name">'+i.label+'</span><span class="num buy" id="ga_'+i.id+'">—<small class="chg" id="gpa_'+i.id+'">%0.00</small></span><span class="num sell" id="gs_'+i.id+'">—<small class="chg" id="gps_'+i.id+'">%0.00</small></span><span class="num cc" id="gk_'+i.id+'">—</span></div>'});byId('goldRows').innerHTML=g;var f='';fxItems().forEach(function(x){f+='<div class="side-row"><span class="side-name">'+x.flag+' '+x.label+'</span><span class="side-num buy" id="fba_'+x.id+'">—</span><span class="side-num sell" id="fbs_'+x.id+'">—</span></div>'});byId('fxRows').innerHTML=f;var h='';scrapItems().forEach(function(x){h+='<div class="side-row"><span class="side-name">'+x.label+'</span><span class="side-num buy" id="hba_'+x.id+'">—</span><span class="side-num sell" id="hbs_'+x.id+'">—</span></div>'});byId('scrapRows').innerHTML=h;applyPanels()}
function applyPanels(){var d=tvDisplay.showDoviz===true,h=tvDisplay.showHurda===true,fx=byId('fxCard'),hu=byId('scrapCard'),side=byId('sidePanel'),dash=byId('dashboard');if(fx)fx.style.display=d?'grid':'none';if(hu)hu.style.display=h?'grid':'none';var any=d||h;if(side){side.style.display=any?'grid':'none';side.classList.toggle('one',any&&!(d&&h))}if(dash){dash.classList.toggle('only-gold',!any)}}
function setNum(el,v,key){if(!el)return;var old=prevPrice[key];el.firstChild.nodeValue=v;if(old!==undefined&&old!==v){el.classList.remove('flash-up','flash-down');void el.offsetWidth;el.classList.add(Number(v.replace(/\./g,''))>Number(old.replace(/\./g,''))?'flash-up':'flash-down');setTimeout(function(){el.classList.remove('flash-up','flash-down')},600)}prevPrice[key]=v}
function updateValues(){build();byId('hasA').textContent=hasA?fmt(hasA):'—';byId('hasS').textContent=hasS?fmt(hasS):'—';if(settings.logoData&&settings.customLogoEnabled)byId('logo').src=settings.logoData;var kk=Number(settings.kkOran)||0;allItems().forEach(function(i){var l=labor(i),a=hasA?Math.round(hasA*(Number(l.a)||i.defA||1)):0,s=hasS?Math.round(hasS*(Number(l.s)||i.defS||1)):0,k=s?Math.round(s*(1+kk/100)):0;setNum(byId('ga_'+i.id),a?a.toLocaleString('tr-TR'):'—','a_'+i.id);setNum(byId('gs_'+i.id),s?s.toLocaleString('tr-TR'):'—','s_'+i.id);var ke=byId('gk_'+i.id);if(ke)ke.textContent=k?k.toLocaleString('tr-TR'):'—';var oa=prevPrice['_pa_'+i.id],os=prevPrice['_ps_'+i.id],pa=byId('gpa_'+i.id),ps=byId('gps_'+i.id);if(pa){if(oa&&a&&a!==oa){var da=(a-oa)/oa*100;pa.textContent=(da>0?'+':'')+da.toFixed(2)+'%'}if(a)prevPrice['_pa_'+i.id]=a}if(ps){if(os&&s&&s!==os){var ds=(s-os)/os*100;ps.textContent=(ds>0?'+':'')+ds.toFixed(2)+'%'}if(s)prevPrice['_ps_'+i.id]=s}});fxItems().forEach(function(x){var da=Number((settings.dovizDuz||{})[x.id+'A'])||0,ds=Number((settings.dovizDuz||{})[x.id+'S'])||0,a=live[x.id+'Alis'],s=live[x.id+'Satis'];var ea=byId('fba_'+x.id),es=byId('fbs_'+x.id);if(ea)ea.textContent=a!=null?(Number(a)+da).toFixed(2):'—';if(es)es.textContent=s!=null?(Number(s)+ds).toFixed(2):'—'});scrapItems().forEach(function(x){var ca=Number((settings.hurdaCarp||{})[x.id+'A'])||x.oran*.99,cs=Number((settings.hurdaCarp||{})[x.id+'S'])||x.oran,ea=byId('hba_'+x.id),es=byId('hbs_'+x.id);if(ea)ea.textContent=hasA?fmt(hasA*ca):'—';if(es)es.textContent=hasS?fmt(hasS*cs):'—'})}
function getRow(id){return fetch(TABLE+'?id=eq.'+encodeURIComponent(id)+'&select=data,updated_at&limit=1&v='+Date.now(),{cache:'no-store',headers:{apikey:SUPABASE_KEY}}).then(function(r){if(!r.ok)throw new Error('Supabase '+r.status);return r.json()}).then(function(rows){return Array.isArray(rows)&&rows.length?rows[0]:null})}
function loadSettings(){if(settingsBusy)return;settingsBusy=true;getRow('asil_settings').then(function(row){if(row&&row.data&&typeof row.data==='object'){settings=Object.assign(settings,row.data);settings.customItems=Array.isArray(row.data.customItems)?row.data.customItems:[];settings.itemOrder=Array.isArray(row.data.itemOrder)?row.data.itemOrder:[];settings.hiddenItems=Array.isArray(row.data.hiddenItems)?row.data.hiddenItems:[];settings.deletedItems=Array.isArray(row.data.deletedItems)?row.data.deletedItems:[];settings.dovizItems=Array.isArray(row.data.dovizItems)?row.data.dovizItems:[];settings.hurdaItems=Array.isArray(row.data.hurdaItems)?row.data.hurdaItems:[];builtSignature='';applyTheme();updateValues()}}).catch(function(e){console.warn('[Asil TV] settings',e)}).finally(function(){settingsBusy=false})}
function loadDisplay(){if(displayBusy)return;displayBusy=true;getRow('tv_display').then(function(row){var d=row&&row.data&&typeof row.data==='object'?row.data:null;if(d){var next={showDoviz:d.showDoviz===true,showHurda:d.showHurda===true};if(next.showDoviz!==tvDisplay.showDoviz||next.showHurda!==tvDisplay.showHurda){tvDisplay=next;builtSignature='';build();updateValues()}else applyPanels()}}).catch(function(e){console.warn('[Asil TV] display',e)}).finally(function(){displayBusy=false})}
function loadPrices(){if(priceBusy)return;priceBusy=true;fetch(WORKER+'?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('worker '+r.status);return r.json()}).then(function(d){live=d||{};var a=Number(d.hasAlis),s=Number(d.hasSatis);if(a>100&&s>100){hasA=a+(Number(settings.hasDuzA)||0);hasS=s+(Number(settings.hasDuzS)||0);byId('time').textContent=new Date().toLocaleTimeString('tr-TR');updateValues()}}).catch(function(e){console.warn('[Asil TV] prices',e)}).finally(function(){priceBusy=false})}
applyTheme();build();Promise.allSettled([loadSettings(),loadDisplay(),loadPrices()]);setInterval(loadSettings,10000);setInterval(loadDisplay,10000);setInterval(loadPrices,5000);
})();
</script>
</body>
