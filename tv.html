<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Asil Kuyumculuk TV</title>
<style>
:root{
  --bg:#ffffff;
  --card:#ffffff;
  --soft:#f4f7f9;
  --line:#d7e0e7;
  --text:#172235;
  --muted:#687989;
  --red:#d92c2c;
  --green:#16824f;
  --blue:#2f77b7;
  --goldRows:10;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg); color:var(--text);
}
body.dark{
  --bg:#0d141b;--card:#111a22;--soft:#18232d;--line:#2b3b48;
  --text:#edf5fb;--muted:#9fb0be;--red:#ff6b67;--green:#55d486;--blue:#69b8ff;
}

.app{
  width:100vw;height:100vh;height:100dvh;max-height:100dvh;overflow:hidden;
  display:grid;
  grid-template-rows:46px 54px minmax(0,1fr);
  gap:4px;padding:4px 6px 5px;
}
.top{position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.logo{height:44px;max-width:230px;object-fit:contain}
body:not(.dark) .logo{
  filter:brightness(0) saturate(100%) sepia(18%) saturate(520%)
         hue-rotate(338deg) brightness(43%) contrast(95%);
}
.theme{
  position:absolute;right:5px;top:5px;width:68px;height:32px;
  border:1px solid var(--line);border-radius:20px;background:var(--card);
  color:var(--text);font-size:16px;cursor:pointer;
}

.status{
  display:grid;grid-template-columns:1.25fr .72fr .72fr;
  min-height:0;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;background:var(--card);
}
.status>div{
  min-width:0;padding:5px 12px;display:flex;flex-direction:column;justify-content:center;
}
.status>div+div{border-left:1px solid var(--line)}
.live{font-size:16px;font-weight:900;white-space:nowrap}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#15c875;margin-right:6px}
.sub,.lab{font-size:10px;color:var(--muted)}
.val{font-size:25px;line-height:1;font-weight:950}
#hasA{color:var(--red)} #hasS{color:var(--green)}

.dashboard{
  min-height:0;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,68fr) minmax(300px,32fr);gap:8px;
}
.dashboard.only-gold{grid-template-columns:1fr}
.dashboard.only-gold #sidePanel{display:none}

.card{
  min-width:0;min-height:0;overflow:hidden;background:var(--card);
  border:1px solid var(--line);border-radius:14px;
}

.gold{
  display:grid;
  grid-template-rows:32px 24px minmax(0,1fr);
}
.title{
  display:flex;align-items:center;padding:0 12px;
  border-bottom:1px solid var(--line);font-size:15px;font-weight:950;
}
.head,.row{
  display:grid;grid-template-columns:1.45fr 1fr 1fr 1fr;align-items:center;
}
.head{
  min-height:0;padding:0 10px;background:var(--soft);
  border-bottom:1px solid var(--line);font-size:10px;font-weight:900;color:var(--muted);
}
.head span:not(:first-child),.num{text-align:right}
.head span:nth-child(2){color:var(--red)}
.head span:nth-child(3){color:var(--green)}
.head span:nth-child(4){color:var(--blue)}

.rows{
  min-height:0;overflow:hidden;display:grid;
  grid-template-rows:repeat(var(--goldRows),minmax(0,1fr));
}
.row{
  min-height:0;overflow:hidden;padding:1px 10px;border-bottom:1px solid var(--line);
}
.row:nth-child(even){background:rgba(110,135,155,.045)}
.name{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:clamp(12px,1.18vw,17px);font-weight:900;line-height:1;
}
.num{
  font-size:clamp(14px,1.38vw,20px);font-weight:950;line-height:1;
}
.buy{color:var(--red)} .sell{color:var(--green)} .cc{color:var(--blue)}
.chg{
  display:block;margin-top:1px;font-size:clamp(6px,.58vw,9px);
  line-height:1;font-weight:800;opacity:.9;
}

.side{
  min-height:0;overflow:hidden;display:grid;
  grid-template-rows:minmax(0,1.06fr) minmax(0,.94fr);gap:8px;
}
.side.one{
  display:grid;grid-template-rows:minmax(0,1fr);gap:0;min-height:0;
}
.sidecard{
  min-height:0;overflow:hidden;
  display:grid;grid-template-rows:32px 22px minmax(0,1fr);
}
.side.one .sidecard{
  height:100%;max-height:none;min-height:0;
  grid-template-rows:32px 22px minmax(0,1fr);
}
.side-title{
  display:flex;align-items:center;padding:0 10px;
  border-bottom:1px solid var(--line);font-size:14px;font-weight:950;
}
.fx .side-title{color:var(--blue)}
.side-head,.side-row{
  display:grid;grid-template-columns:1.25fr .75fr .75fr;align-items:center;
}
.side-head{
  padding:0 9px;background:var(--soft);border-bottom:1px solid var(--line);
  font-size:9px;font-weight:900;color:var(--muted);
}
.side-head span:nth-child(2){color:var(--red)}
.side-head span:nth-child(3){color:var(--green)}
.side-head span:not(:first-child),.side-row span:not(:first-child){text-align:right}

.side-rows{
  min-height:0;overflow:hidden;display:grid;grid-auto-rows:minmax(0,1fr);
}
.side.one .side-rows{
  display:grid;grid-auto-rows:minmax(0,1fr);overflow:hidden;min-height:0;
}
.side-row{
  min-height:0;overflow:hidden;padding:1px 9px;border-bottom:1px solid var(--line);
}
.side.one .side-row{
  height:auto;min-height:0;
}
.side-row:nth-child(even){background:rgba(110,135,155,.04)}
.side-name{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:clamp(11px,1vw,15px);font-weight:900;line-height:1;
}
.side-num{
  font-size:clamp(12px,1.1vw,17px);font-weight:950;line-height:1;
}

@keyframes flashUp{0%{background:rgba(22,130,79,.24)}100%{background:transparent}}
@keyframes flashDown{0%{background:rgba(217,44,44,.22)}100%{background:transparent}}
.flash-up{animation:flashUp .55s ease-out}
.flash-down{animation:flashDown .55s ease-out}

@media(max-height:700px){
  .app{grid-template-rows:42px 48px minmax(0,1fr);gap:3px;padding:3px 5px 4px}
  .logo{height:40px}
  .theme{top:4px;height:30px}
  .status>div{padding:2px 7px}
  .live{font-size:13px}.sub,.lab{font-size:8px}.val{font-size:20px}
  .gold{grid-template-rows:29px 21px minmax(0,1fr)}
  .title{font-size:13px}.head{font-size:8.5px}
  .sidecard,.side.one .sidecard{grid-template-rows:29px 20px minmax(0,1fr)}
  .side-title{font-size:12px}.side-head{font-size:8px}
  .name{font-size:clamp(10.5px,1.05vw,15px)}
  .num{font-size:clamp(12.5px,1.25vw,18px)}
  .side-name{font-size:clamp(9.5px,.9vw,13px)}
  .side-num{font-size:clamp(10.5px,1vw,15px)}
}
</style>

<body>
<div class="app">
  <div class="top">
    <img id="logo" class="logo" src="asil-logo-integrated.png" alt="Asil Kuyumculuk">
    <button id="theme" class="theme" type="button">☀ / ☾</button>
  </div>

  <div class="status">
    <div>
      <div class="live"><span class="dot"></span>Piyasa Canlı</div>
      <div class="sub">Son güncelleme: <span id="time">--:--:--</span></div>
    </div>
    <div><div class="lab">Has Alış</div><div class="val" id="hasA">—</div></div>
    <div><div class="lab">Has Satış</div><div class="val" id="hasS">—</div></div>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="card gold">
      <div class="title">🪙 Altın Fiyatları</div>
      <div class="head"><span>Birim</span><span>Alış</span><span>Satış</span><span>K. Kartı</span></div>
      <div class="rows" id="goldRows"></div>
    </div>

    <div class="side" id="sidePanel">
      <div class="card sidecard fx" id="fxCard">
        <div class="side-title">💱 DÖVİZ KURLARI</div>
        <div class="side-head"><span>Döviz</span><span>Alış</span><span>Satış</span></div>
        <div class="side-rows" id="fxRows"></div>
      </div>

      <div class="card sidecard" id="scrapCard">
        <div class="side-title">🪙 HURDA ALTIN</div>
        <div class="side-head"><span>Tür</span><span>Alış</span><span>Satış</span></div>
        <div class="side-rows" id="scrapRows"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

var SETTINGS_URL='https://asil-kuyumculuk-2feb6-default-rtdb.firebaseio.com/ayarlarLite.json';
var TV_URL='https://asil-kuyumculuk-2feb6-default-rtdb.firebaseio.com/tvDisplay.json';
var WORKER='https://altin-proxy.ufuk87900.workers.dev';

var settings={labor:{},customItems:[],itemOrder:[],hiddenItems:[],deletedItems:[],kkOran:0,dovizDuz:{},hurdaCarp:{},theme:'light'};
var tvDisplay={showDoviz:true,showHurda:true};
var live={},hasA=0,hasS=0;
var prevPrice={};

var TV_CACHE_KEY='asil_tv_price_cache_v50';

function saveTvPriceCache(){
  try{
    localStorage.setItem(TV_CACHE_KEY,JSON.stringify({
      live:live,hasA:hasA,hasS:hasS,prevPrice:prevPrice,ts:Date.now()
    }));
  }catch(e){}
}
function restoreTvPriceCache(){
  try{
    var c=JSON.parse(localStorage.getItem(TV_CACHE_KEY)||'null');
    if(!c||!c.ts||Date.now()-c.ts>1800000)return;
    if(c.live&&typeof c.live==='object')live=c.live;
    if(c.prevPrice&&typeof c.prevPrice==='object')prevPrice=c.prevPrice;
    if(Number(c.hasA)>100)hasA=Number(c.hasA);
    if(Number(c.hasS)>100)hasS=Number(c.hasS);
    if(hasA>100&&hasS>100){
      buildStructureIfNeeded();
      updateValues();
      byId('time').textContent='yenileniyor…';
    }
  }catch(e){}
}

var builtSignature='';
var settingsBusy=false,priceBusy=false,tvBusy=false;

var ITEMS=[
{id:'has24',label:'24 Ayar',defA:1,defS:1.003},
{id:'ayar22',label:'22 Ayar',defA:.91,defS:.922},
{id:'tam',label:'Tam',defA:.993,defS:1.008},
{id:'yarim',label:'Yarım',defA:.993,defS:1.009},
{id:'ceyrek',label:'Çeyrek',defA:.992,defS:1.01},
{id:'besli',label:'Beşli',defA:.993,defS:1.008},
{id:'yarimbes',label:'Yarım Beşli',defA:.993,defS:1.0085},
{id:'resat',label:'Reşat',defA:.993,defS:1.007},
{id:'ata',label:'Ata',defA:.993,defS:1.007},
{id:'gremise',label:'Gremise',defA:.993,defS:1.008}
];
var DEFAULT_FX=[
['usd','🇺🇸','USD'],['eur','🇪🇺','EUR'],['gbp','🇬🇧','GBP'],['sar','🇸🇦','SAR'],['chf','🇨🇭','CHF']
];
var DEFAULT_SCR=[
['hurda22','22 Ayar Hurda',22/24],['hurda14','14 Ayar Hurda',14/24],['hurda8','8 Ayar Hurda',8/24]
];


function fxItems(){
  var arr=(settings.dovizItems&&settings.dovizItems.length)?settings.dovizItems:null;
  if(!arr)return DEFAULT_FX.map(function(x){return {id:x[0],flag:x[1],label:x[2]}});
  return arr.map(function(x){return {id:x.id,flag:x.flag||'',label:x.label||String(x.id).toUpperCase()}});
}
function scrapItems(){
  var arr=(settings.hurdaItems&&settings.hurdaItems.length)?settings.hurdaItems:null;
  if(!arr)return DEFAULT_SCR.map(function(x){return {id:x[0],label:x[1],oran:x[2]}});
  return arr.map(function(x){return {id:x.id,label:x.label,oran:Number(x.oran)||0}});
}
function fmt(n){return new Intl.NumberFormat('tr-TR').format(Math.round(Number(n)||0))}
function byId(id){return document.getElementById(id)}
function allItems(){
  var a=ITEMS.concat(settings.customItems||[]),map={},out=[];
  a.forEach(function(x){map[x.id]=x});
  (settings.itemOrder||[]).forEach(function(id){
    if(map[id]){out.push(map[id]);delete map[id]}
  });
  a.forEach(function(x){if(map[x.id])out.push(x)});
  var hidden=settings.hiddenItems||[],deleted=settings.deletedItems||[];
  return out.filter(function(x){return hidden.indexOf(x.id)<0 && deleted.indexOf(x.id)<0});
}
function labor(i){
  return (settings.labor&&settings.labor[i.id])||{a:i.defA||1,s:i.defS||1};
}
function theme(){
  var mode=localStorage.getItem('asil_theme_local')||settings.theme||'light';
  document.body.classList.toggle('dark',mode==='dark');
}
byId('theme').addEventListener('click',function(){
  var next=document.body.classList.contains('dark')?'light':'dark';
  localStorage.setItem('asil_theme_local',next);
  theme();
});

function structureSignature(){
  return JSON.stringify({
    items:allItems().map(function(x){return x.id+':'+x.label}),
    fx:fxItems().map(function(x){return x.id+':'+x.label}).join('|'),
    sc:scrapItems().map(function(x){return x.id+':'+x.label+':'+x.oran}).join('|'),
    d:tvDisplay.showDoviz!==false,
    h:tvDisplay.showHurda!==false
  });
}

function buildStructureIfNeeded(){
  var sig=structureSignature();
  if(sig===builtSignature)return;
  builtSignature=sig;

  var list=allItems();
  document.documentElement.style.setProperty('--goldRows',String(Math.max(1,list.length)));

  var g='';
  list.forEach(function(i){
    g+='<div class="row" data-id="'+i.id+'">'
      +'<span class="name">'+i.label+'</span>'
      +'<span class="num buy" id="ga_'+i.id+'">—<small class="chg" id="gpa_'+i.id+'">%0.00</small></span>'
      +'<span class="num sell" id="gs_'+i.id+'">—<small class="chg" id="gps_'+i.id+'">%0.00</small></span>'
      +'<span class="num cc" id="gk_'+i.id+'">—</span></div>';
  });
  byId('goldRows').innerHTML=g;

  var f='';
  fxItems().forEach(function(x){
    f+='<div class="side-row"><span class="side-name">'+x.flag+' '+x.label+'</span>'
      +'<span class="side-num buy" id="fba_'+x.id+'">—</span>'
      +'<span class="side-num sell" id="fbs_'+x.id+'">—</span></div>';
  });
  byId('fxRows').innerHTML=f;

  var h='';
  scrapItems().forEach(function(x){
    h+='<div class="side-row"><span class="side-name">'+x.label+'</span>'
      +'<span class="side-num buy" id="hba_'+x.id+'">—</span>'
      +'<span class="side-num sell" id="hbs_'+x.id+'">—</span></div>';
  });
  byId('scrapRows').innerHTML=h;

  applyPanelOptions();
}

function applyPanelOptions(){
  var showD=tvDisplay.showDoviz!==false;
  var showH=tvDisplay.showHurda!==false;
  var fx=byId('fxCard'),hu=byId('scrapCard'),side=byId('sidePanel'),dash=byId('dashboard');

  if(fx){
    fx.hidden=!showD;
    fx.style.setProperty('display',showD?'grid':'none','important');
  }
  if(hu){
    hu.hidden=!showH;
    hu.style.setProperty('display',showH?'grid':'none','important');
  }

  var any=showD||showH;

  if(side){
    side.style.setProperty('display',any?'grid':'none','important');
    side.classList.toggle('one',any && !(showD&&showH));
  }

  if(dash){
    dash.classList.toggle('only-gold',!any);
    if(!any){
      dash.style.setProperty('grid-template-columns','1fr','important');
    }else{
      dash.style.removeProperty('grid-template-columns');
    }
  }

  /* opsiyon değiştiğinde bir defalık reflow */
  requestAnimationFrame(function(){
    document.documentElement.style.setProperty('--goldRows',String(Math.max(1,allItems().length)));
  });
}

function setNumber(el,value,key){
  if(!el)return;
  var old=prevPrice[key];
  el.firstChild.nodeValue=value;
  if(old!==undefined && old!==value){
    el.classList.remove('flash-up','flash-down');
    void el.offsetWidth;
    el.classList.add(Number(value.replace(/\./g,''))>Number(old.replace(/\./g,''))?'flash-up':'flash-down');
    setTimeout(function(){el.classList.remove('flash-up','flash-down')},600);
  }
  prevPrice[key]=value;
}

function updateValues(){
  buildStructureIfNeeded();

  byId('hasA').textContent=hasA?fmt(hasA):'—';
  byId('hasS').textContent=hasS?fmt(hasS):'—';

  if(settings.logoData&&settings.customLogoEnabled)byId('logo').src=settings.logoData;

  var kk=Number(settings.kkOran)||0;
  allItems().forEach(function(i){
    var l=labor(i);
    var a=hasA?Math.round(hasA*(Number(l.a)||i.defA||1)):0;
    var s=hasS?Math.round(hasS*(Number(l.s)||i.defS||1)):0;
    var k=s?Math.round(s*(1+kk/100)):0;

    var aText=a?fmt(a):'—',sText=s?fmt(s):'—',kText=k?fmt(k):'—';
    setNumber(byId('ga_'+i.id),aText,'a_'+i.id);
    setNumber(byId('gs_'+i.id),sText,'s_'+i.id);
    if(byId('gk_'+i.id))byId('gk_'+i.id).textContent=kText;

    // Değişim yüzdesi son gerçek fiyat değişimine kadar sabit kalsın.
    // Aynı fiyat tekrar geldiğinde %0.00'a sıfırlama.
    var oldA=prevPrice['_pctA_'+i.id],oldS=prevPrice['_pctS_'+i.id];
    var pa=byId('gpa_'+i.id),ps=byId('gps_'+i.id);

    if(pa){
      if(oldA && a && a!==oldA){
        var da=(a-oldA)/oldA*100;
        var txtA=(da>0?'+':'')+da.toFixed(2)+'%';
        pa.textContent=txtA;
        prevPrice['_pctAText_'+i.id]=txtA;
      }else if(prevPrice['_pctAText_'+i.id]){
        pa.textContent=prevPrice['_pctAText_'+i.id];
      }
      if(a) prevPrice['_pctA_'+i.id]=a;
    }

    if(ps){
      if(oldS && s && s!==oldS){
        var ds=(s-oldS)/oldS*100;
        var txtS=(ds>0?'+':'')+ds.toFixed(2)+'%';
        ps.textContent=txtS;
        prevPrice['_pctSText_'+i.id]=txtS;
      }else if(prevPrice['_pctSText_'+i.id]){
        ps.textContent=prevPrice['_pctSText_'+i.id];
      }
      if(s) prevPrice['_pctS_'+i.id]=s;
    }
  });

  fxItems().forEach(function(x){
    var da=Number((settings.dovizDuz||{})[x.id+'A'])||0;
    var ds=Number((settings.dovizDuz||{})[x.id+'S'])||0;
    var a=live[x.id+'Alis'],sv=live[x.id+'Satis'];
    var ea=byId('fba_'+x.id),es=byId('fbs_'+x.id);
    if(ea)ea.textContent=a?(Number(a)+da).toFixed(2):'—';
    if(es)es.textContent=sv?(Number(sv)+ds).toFixed(2):'—';
  });

  scrapItems().forEach(function(x){
    var ca=Number((settings.hurdaCarp||{})[x.id+'A'])||x.oran*.99;
    var cs=Number((settings.hurdaCarp||{})[x.id+'S'])||x.oran;
    var ea=byId('hba_'+x.id),es=byId('hbs_'+x.id);
    if(ea)ea.textContent=hasA?fmt(hasA*ca):'—';
    if(es)es.textContent=hasS?fmt(hasS*cs):'—';
  });
}

async function loadTvDisplay(){
  if(tvBusy)return; tvBusy=true;
  try{
    var r=await fetch(TV_URL+'?v='+Date.now(),{cache:'no-store'});
    if(r.ok){
      var d=await r.json()||{};
      var next={showDoviz:d.showDoviz!==false,showHurda:d.showHurda!==false};
      if(next.showDoviz!==tvDisplay.showDoviz || next.showHurda!==tvDisplay.showHurda){
        tvDisplay=next;
        builtSignature='';
        buildStructureIfNeeded();
        applyPanelOptions();
      }
    }
  }catch(e){}
  tvBusy=false;
}


function applySettingsSnapshot(d){
  if(!d || typeof d!=='object') return;

  var oldStructure = structureSignature();

  /* Normal ayarları uygula */
  settings = Object.assign(settings, d);

  /* Firebase'de bir liste tamamen silindiyse eski cihaz belleğinde kalmasın.
     Bu bölüm özellikle TV'de silinen ürünün yenilemeden kaybolmaması sorununu çözer. */
  settings.customItems = Array.isArray(d.customItems) ? d.customItems : [];
  settings.itemOrder   = Array.isArray(d.itemOrder)   ? d.itemOrder   : [];
  settings.hiddenItems = Array.isArray(d.hiddenItems) ? d.hiddenItems : [];
  settings.deletedItems= Array.isArray(d.deletedItems)? d.deletedItems: [];
  settings.dovizItems  = Array.isArray(d.dovizItems)  ? d.dovizItems  : [];
  settings.hurdaItems  = Array.isArray(d.hurdaItems)  ? d.hurdaItems  : [];

  var newStructure = structureSignature();
  if(oldStructure !== newStructure){
    builtSignature='';
    buildStructureIfNeeded();
  }

  theme();
  updateValues();
}

function startSettingsRealtime(){
  if(!window.EventSource) return;
  try{
    var es = new EventSource(SETTINGS_URL);
    es.addEventListener('put',function(ev){
      try{
        var msg=JSON.parse(ev.data||'{}');
        if(msg.path==='/' && msg.data && typeof msg.data==='object') applySettingsSnapshot(msg.data);
      }catch(e){}
    });
    es.addEventListener('patch',function(ev){
      try{
        var msg=JSON.parse(ev.data||'{}');
        if(msg.path) loadSettings();
      }catch(e){}
    });
    // EventSource kendi yeniden bağlanmasını yapar; REST polling yok.
  }catch(e){}
}

async function loadSettings(){
  if(settingsBusy)return; settingsBusy=true;
  try{
    var r=await fetch(SETTINGS_URL+'?v='+Date.now(),{cache:'no-store'});
    if(r.ok){
      var d=await r.json();
      if(d&&typeof d==='object') applySettingsSnapshot(d);
    }
  }catch(e){}
  settingsBusy=false;
}

async function loadPrices(){
  if(priceBusy)return; priceBusy=true;
  try{
    var r=await fetch(WORKER+'?v='+Date.now(),{cache:'no-store'});
    if(r.ok){
      var d=await r.json()||{};
      live=d;
      var a=Number(d.hasAlis),s=Number(d.hasSatis);
      if(a>100&&s>100){
        hasA=a+(Number(settings.hasDuzA)||0);
        hasS=s+(Number(settings.hasDuzS)||0);
        byId('time').textContent=new Date().toLocaleTimeString('tr-TR');
        updateValues();
        saveTvPriceCache();
      }
    }
  }catch(e){}
  priceBusy=false;
}

theme();
buildStructureIfNeeded();
restoreTvPriceCache();

/* İlk açılışta istekleri paralel başlat: bekleme zinciri yok. */
Promise.allSettled([
  loadTvDisplay(),
  loadSettings(),
  loadPrices()
]);

/* Ürün ekleme/silme/sıralama TV'ye yenilemesiz gelsin. */
startSettingsRealtime();

/* Dengeli polling: hızlı ama sistemi yormaz. */
setInterval(loadTvDisplay,15000);
// Firebase ayarları artık 8 saniyede bir büyük snapshot olarak çekilmiyor; SSE kullanılıyor.
setInterval(loadPrices,2000);
})();
</script>
